[project]
name = "home-credit"
version = "0.1.0"
description = "Home Credit - Credit Risk Model Stability"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Data handling
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0,<2.0.0",
    # ML
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.5",
    "xgboost>=2.0.0",
    # EDA and viz
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Notebooks
    "jupyterlab>=4.1.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    # Utilities
    "tqdm>=4.66.0",
    "kaggle>=1.6.0",
    # Optional but useful
    "optuna>=3.6.0",
    "shap>=0.45.0",
]